# Despliegue en Cloudflare: un unico Worker que sirve la PWA (assets) y la API (/api/*).
#
# En el panel de Cloudflare -> tu proyecto -> Settings -> Build:
#   Build command:   npm run build
#   Deploy command:  npx wrangler deploy
#   Version de Node: se toma de .node-version (20)
#
# Antes del primer despliegue con API necesitas (ver README, seccion "Cuenta y sync"):
#   1. Crear la base D1:      npx wrangler d1 create pedalea_a_polonia
#      y pegar el database_id devuelto abajo.
#   2. Aplicar migraciones:   npx wrangler d1 migrations apply pedalea_a_polonia --remote
#   3. Definir los secretos:  npx wrangler secret put GOOGLE_CLIENT_SECRET
#                             npx wrangler secret put SESSION_SECRET
#   4. Ajustar APP_URL y GOOGLE_CLIENT_ID abajo (o como variables en el panel).

name = "bikepacking"
main = "worker/index.ts"
compatibility_date = "2024-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Fallback SPA para React Router en rutas que no son un archivo.
not_found_handling = "single-page-application"
# La API pasa por el Worker antes que el fallback SPA.
run_worker_first = ["/api/*"]

[vars]
# URL publica de la app (sin barra final). En produccion, la de tu Worker/dominio.
APP_URL = "https://bikepacking.castrolaura0311.workers.dev/"
# Client ID de Google OAuth (no es secreto). Vacio = login deshabilitado.
GOOGLE_CLIENT_ID = "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.apps.googleusercontent.com"

# Base de datos D1. Rellena database_id tras `wrangler d1 create pedalea_a_polonia`.
[[d1_databases]]
binding = "DB"
database_name = "pedalea_a_polonia"
database_id = "23def651-c4f9-41fe-b00e-7f962f234e53"
migrations_dir = "migrations"

# Secretos (NO se ponen aqui): GOOGLE_CLIENT_SECRET, SESSION_SECRET.
# Local: archivo .dev.vars (ver .dev.vars.example).
# Produccion: `npx wrangler secret put <NOMBRE>`.
